<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spanish Preterite — Large Print</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eee; color: #111; font-family: Arial, Helvetica, sans-serif; }
    .toolbar { padding: 20px; text-align: center; font-size: 44pt; font-weight: 700; }
    .version { margin: 12px 0 0; font-size: 16px; }
    button { padding: 12px 24px; font: inherit; cursor: pointer; }
    .sheet { background: white; width: 7.5in; min-height: 10in; margin: 20px auto; padding: .2in; }
    .verb { padding: .15in 0; font-size: 44pt; font-weight: 700; }
    .verb + .verb { border-top: 2px solid #999; padding-top: .35in; }
    h1 { font-size: inherit; margin: 0 0 64px; line-height: 1.2; overflow-wrap: anywhere; }
    .forms { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px 24px; font-size: inherit; line-height: 1.2; }
    .forms > div { overflow-wrap: anywhere; }
    :root { --reading-size: 44pt; }
    [hidden] { display: none !important; }
    .layout { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 20px; align-items: start; }
    .page-nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; background: #fff; padding: 12px; border-right: 2px solid #999; }
    .page-nav button { display: block; width: 100%; text-align: left; font-size: var(--reading-size); font-weight: 700; margin-bottom: 8px; }
    .page-nav button[aria-current="page"] { background: #173d65; color: white; }
    .page-nav button:disabled { opacity: 1; color: #111; }
    .page-nav button[aria-current="page"]:disabled { color: white; }
    .sheet { max-width: 100%; }
    .page-number { text-align: right; font-size: var(--reading-size); font-weight: 700; margin-bottom: 20px; }
    .account { font-size: 22px; padding: 16px; background: white; margin: 12px; }
    .account button { font-size: 22px; margin: 4px; }
    input { font: inherit; padding: 8px; max-width: 100%; }
    label { display: inline-block; margin: 8px; }
    .center-frame { display: grid; grid-template-columns: minmax(0, 7.5in) max-content; gap: 64px; justify-content: space-between; align-items: start; padding-right: 16px; }
    #pages { min-width: 0; position: relative; }
    @media screen {
      #pages.recording-blank::after { content: ''; position: absolute; inset: 0; background: white; z-index: 1; }
      #pages.recording-blank > .sheet { visibility: hidden !important; }
    }
    .recording-side { margin-top: var(--recording-top, 100px); width: 160px; font-size: 20px; }
    #record { font-size: 28px; width: 100%; }
    #record[aria-pressed="true"] { background: #a71919; color: white; }
    .recording-side button { margin-bottom: 12px; }
    #status { overflow-wrap: anywhere; }
    #status.quiet { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media screen and (max-width: 650px) { .center-frame { gap: 12px; padding-right: 4px; } .recording-side { width: 76px; font-size: 16px; } #record { font-size: 20px; padding: 10px 4px; } }
    @media screen and (max-width: 1100px) { :root { --reading-size: 42px; } .verb { font-size: var(--reading-size); } .sheet { width: 100%; } }
    @media screen and (max-width: 650px) { :root { --reading-size: 32px; } .layout { gap: 6px; grid-template-columns: 140px minmax(0, 1fr); } .page-nav { padding: 4px; } .page-nav button { padding: 8px 4px; } .sheet { padding: 12px; } .verb { font-size: var(--reading-size); } .forms { gap: 16px 8px; } h1 { margin-bottom: 32px; } }
    @page { size: letter; margin: .5in; }
    @media print {
      body { background: white; }
      .toolbar, .page-nav, .recording-side, .account { display: none; }
      .center-frame { display: block; padding: 0; }
      #pages { visibility: visible !important; }
      .layout { display: block; }
      .sheet[hidden] { display: block !important; }
      .page-number { font-size: 16pt; margin-bottom: 8px; }
      .sheet { width: auto; min-height: 0; height: 10in; margin: 0; padding: .2in; break-after: page; }
      .sheet:last-child { break-after: auto; }
      .verb { break-inside: avoid; }
    }
    @media screen and (max-width: 750px) {
      .sheet { width: calc(100% - 24px); min-height: 0; padding: 24px; }
      .verb { height: auto; padding-bottom: 36px; }
      .toolbar { font-size: 42px; }
    }
    .sheet.measure { position: absolute; left: -10000px; visibility: hidden; width: 7.5in; max-width: none; min-height: 0; height: auto; margin: 0; padding: .2in; }
    .measure h1 { margin-bottom: 64px; }
    .measure .forms { gap: 28px 24px; }
    .measure .verb { font-size: 44pt; padding: .15in 0; }
    .measure .verb + .verb { padding-top: .35in; }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Print conjugations</button><p class="version" lang="en">Version 2.4</p></div>
  <div class="layout">
    <nav id="page-nav" class="page-nav" aria-label="Pages" lang="en"></nav>
    <div class="center-frame">
      <main id="pages"></main>
      <aside class="recording-side" lang="en" aria-label="Recording">
        <button id="record" disabled aria-pressed="false">Record</button>
        <button id="replay" hidden>Play</button>
        <p id="status" class="quiet" role="status" aria-live="polite">Select Record to practice.</p>
      </aside>
      <audio id="player" hidden></audio>
    </div>
  </div>
  <script>
  (() => {
    // Rows pair singular and plural forms in conventional conjugation-table order.
    const verbs = [
      ['viajar', 'to travel', ['viajé', 'viajamos', 'viajaste', 'viajasteis', 'viajó', 'viajaron']],
      ['decir', 'to say; to tell', ['dije', 'dijimos', 'dijiste', 'dijisteis', 'dijo', 'dijeron']],
      ['venir', 'to come', ['vine', 'vinimos', 'viniste', 'vinisteis', 'vino', 'vinieron']],
      ['tener', 'to have', ['tuve', 'tuvimos', 'tuviste', 'tuvisteis', 'tuvo', 'tuvieron']],
      ['poder', 'to be able to; can', ['pude', 'pudimos', 'pudiste', 'pudisteis', 'pudo', 'pudieron']],
      ['ir', 'to go', ['fui', 'fuimos', 'fuiste', 'fuisteis', 'fue', 'fueron']],
      ['andar', 'to walk', ['anduve', 'anduvimos', 'anduviste', 'anduvisteis', 'anduvo', 'anduvieron']],
      ['hacer', 'to do; to make', ['hice', 'hicimos', 'hiciste', 'hicisteis', 'hizo', 'hicieron']],
      ['ver', 'to see', ['vi', 'vimos', 'viste', 'visteis', 'vio', 'vieron']],
      ['dar', 'to give', ['di', 'dimos', 'diste', 'disteis', 'dio', 'dieron']],
      ['divertirse', 'to have fun', ['me divertí', 'nos divertimos', 'te divertiste', 'os divertisteis', 'se divirtió', 'se divirtieron']],
      ['dormir', 'to sleep', ['dormí', 'dormimos', 'dormiste', 'dormisteis', 'durmió', 'durmieron']],
      ['vestirse', 'to get dressed', ['me vestí', 'nos vestimos', 'te vestiste', 'os vestisteis', 'se vistió', 'se vistieron']],
      ['oír', 'to hear', ['oí', 'oímos', 'oíste', 'oísteis', 'oyó', 'oyeron']],
      ['destruir', 'to destroy', ['destruí', 'destruimos', 'destruiste', 'destruisteis', 'destruyó', 'destruyeron']],
      ['cruzar', 'to cross', ['crucé', 'cruzamos', 'cruzaste', 'cruzasteis', 'cruzó', 'cruzaron']],
      ['jugar', 'to play', ['jugué', 'jugamos', 'jugaste', 'jugasteis', 'jugó', 'jugaron']],
      ['sacar', 'to take out; to take (photos)', ['saqué', 'sacamos', 'sacaste', 'sacasteis', 'sacó', 'sacaron']],
      ['escalar', 'to climb', ['escalé', 'escalamos', 'escalaste', 'escalasteis', 'escaló', 'escalaron']],
      ['suceder', 'to happen', ['sucedí', 'sucedimos', 'sucediste', 'sucedisteis', 'sucedió', 'sucedieron']]
    ];
    const pages = document.getElementById('pages');
    const cards = [];
    for (const [infinitive, meaning, forms] of verbs) {
        // Ustedes (second-person plural) uses the third-person plural conjugation.
        forms[3] = forms[5];
        const card = document.createElement('article');
        card.className = 'verb';
        const heading = document.createElement('h1');
        heading.append(document.createTextNode(infinitive + ' - '));
        const definition = document.createElement('span');
        definition.lang = 'en';
        definition.textContent = meaning;
        heading.append(definition);
        const grid = document.createElement('div');
        grid.className = 'forms';
        for (const form of forms) {
          const cell = document.createElement('div');
          cell.textContent = form;
          grid.append(cell);
        }
        card.append(heading, grid);
        cards.push(card);
    }
    // Measure at the actual print width and keep at most two verbs per sheet.
    const measure = document.createElement('section');
    measure.className = 'sheet measure';
    measure.setAttribute('aria-hidden', 'true');
    document.body.append(measure);
    for (let i = 0; i < cards.length;) {
      const sheet = document.createElement('section');
      sheet.className = 'sheet';
      measure.append(cards[i++]);
      if (i < cards.length) {
        measure.append(cards[i]);
        if (measure.getBoundingClientRect().height <= 10 * 96 - 34) {
          i++;
        } else {
          cards[i].remove();
        }
      }
      sheet.append(...measure.children);
      pages.append(sheet);
    }
    measure.remove();
    const sheets = [...pages.children];
    sheets.forEach((sheet, index) => {
      // Recordings follow verb groups, so resizing a device never changes their identity.
      sheet.dataset.pageKey = [...sheet.querySelectorAll('h1')].map(h => h.firstChild.textContent.trim().replace(/ -$/, '')).join('_');
      const number = document.createElement('div');
      number.className = 'page-number'; number.lang = 'en'; number.textContent = `Page ${index + 1}`;
      sheet.prepend(number);
      const button = document.createElement('button');
      button.textContent = `Page ${index + 1}`;
      button.addEventListener('click', () => window.selectPage(index));
      document.getElementById('page-nav').append(button);
      sheet.hidden = index !== 0;
    });
    window.lessonSheets = sheets;
  })();
  </script>
  <script src="app.js?v=2.4"></script>
</body>
</html>
